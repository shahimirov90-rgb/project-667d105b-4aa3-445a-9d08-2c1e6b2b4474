name: Dependency security updates

on:
  push:
    branches:
      - audit/security-hardening

permissions:
  contents: read

jobs:
  update-vulnerable-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from the committed lockfile
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply compatible security fixes
        id: fix
        shell: bash
        run: |
          set +e
          bun audit fix --ignore-scripts
          status=$?
          set -e
          echo "audit_fix_status=$status" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the updated lockfile
        if: steps.fix.outputs.changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Commit reviewed dependency files to this branch
        if: steps.fix.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const currentRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const parent = currentRef.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parent,
            });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: ["package.json", "bun.lock"].map((path) => ({
                path,
                mode: "100644",
                type: "blob",
                content: fs.readFileSync(path, "utf8"),
              })),
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "chore(deps): apply Bun security audit fixes [audit-fix]",
              tree: tree.data.sha,
              parents: [parent],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false,
            });
            core.info(`Updated dependency lockfile in ${branch}: ${commit.data.sha}`);
