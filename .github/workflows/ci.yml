name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Existing repository formatting debt is handled separately; keep correctness rules active.
      - name: Run ESLint
        run: bunx eslint . --rule 'prettier/prettier: off'

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build
