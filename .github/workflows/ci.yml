name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Block critical dependency vulnerabilities
        run: bun audit --audit-level=critical

      - name: Block high dependency advisories except documented upstream gaps
        run: >-
          bun audit --audit-level=high
          --ignore GHSA-fc5q-39xc-vjpf
          --ignore GHSA-mrhx-c7xc-m3w5

      # Existing repository formatting debt is handled separately; keep correctness rules active.
      - name: Run ESLint
        run: >-
          bunx eslint . --rule "prettier/prettier: off"

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build

  dependency-fix:
    name: Apply compatible dependency security fixes
    needs: checks
    if: ${{ always() && needs.checks.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/audit/security-hardening' && !contains(github.event.head_commit.message, '[audit-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve package ranges without lifecycle scripts
        run: bun install --ignore-scripts

      - name: Apply compatible audit fixes
        id: fix
        shell: bash
        run: |
          set +e
          bun audit fix
          set -e
          if git diff --quiet -- package.json bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated lockfile
        if: steps.fix.outputs.changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Commit dependency files
        if: steps.fix.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const currentRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parent = currentRef.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: ["package.json", "bun.lock"].map((path) => ({
                path, mode: "100644", type: "blob", content: fs.readFileSync(path, "utf8"),
              })),
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "chore(deps): apply Bun security audit fixes [audit-fix]",
              tree: tree.data.sha,
              parents: [parent],
            });
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false,
            });
            core.info(`Updated dependency lockfile: ${commit.data.sha}`);
