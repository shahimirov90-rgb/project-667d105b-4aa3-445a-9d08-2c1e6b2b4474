name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repository currently has widespread pre-existing Prettier violations.
      # Keep ESLint's correctness rules active while formatting is handled separately.
      - name: Run ESLint
        run: bunx eslint . --rule 'prettier/prettier: off'

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test
